name: IdeaStress CI & Business Health Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e .
      - name: Run full unit, security, MCP & CLI test suite
        run: PYTHONPATH=src python3 -m unittest discover -s tests -v
      - name: Run 10-case Industry Benchmark Suite
        run: python3 scripts/run_benchmark.py
      - name: Verify example venture.yaml diff
        run: ideastress diff examples/saas_accounting.yaml examples/saas_accounting_after_test.yaml
